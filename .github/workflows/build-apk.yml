name: Build FORM Android APK

"on":
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ls -la
          if [ ! -f form-android-project.zip ]; then
            echo "::error::form-android-project.zip not found in repo root. Files present:"
            ls -la
            exit 1
          fi
          unzip -o -q form-android-project.zip
          ls -la form-android

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: form-android
        run: npm install

      - name: Build web app
        working-directory: form-android
        run: npm run build

      - name: Add Android platform
        working-directory: form-android
        run: npx cap add android

      - name: Generate app icon & splash screen
        working-directory: form-android
        run: npx @capacitor/assets generate --android

      - name: Apply Android permissions & config
        working-directory: form-android
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          sed -i '/<manifest /a\    <uses-feature android:name="android.hardware.camera" android:required="true" />' "$MANIFEST"
          sed -i '/<manifest /a\    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' "$MANIFEST"

          sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"
          sed -i '/<activity/a\            android:windowSoftInputMode="adjustResize"' "$MANIFEST"

          grep -q 'android.permission.CAMERA' "$MANIFEST" || (echo "::error::Permission patch failed" && exit 1)
          grep -q 'networkSecurityConfig' "$MANIFEST" || (echo "::error::Network security config patch failed" && exit 1)

          mkdir -p android/app/src/main/res/xml
          cp android-config/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml

          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java)
          PKG_LINE=$(head -n 1 "$MAIN_ACTIVITY")
          printf '%s\n' \
            "$PKG_LINE" \
            '' \
            'import android.Manifest;' \
            'import android.content.pm.PackageManager;' \
            'import android.os.Bundle;' \
            'import androidx.core.app.ActivityCompat;' \
            'import androidx.core.content.ContextCompat;' \
            'import com.getcapacitor.BridgeActivity;' \
            '' \
            'public class MainActivity extends BridgeActivity {' \
            '    private static final int CAMERA_PERMISSION_REQUEST_CODE = 1001;' \
            '' \
            '    @Override' \
            '    protected void onCreate(Bundle savedInstanceState) {' \
            '        super.onCreate(savedInstanceState);' \
            '        if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)' \
            '                != PackageManager.PERMISSION_GRANTED) {' \
            '            ActivityCompat.requestPermissions(this, new String[] { Manifest.permission.CAMERA }, CAMERA_PERMISSION_REQUEST_CODE);' \
            '        }' \
            '    }' \
            '}' \
            > "$MAIN_ACTIVITY"

          echo "----- Final AndroidManifest.xml -----"
          cat "$MANIFEST"
          echo "----- Final MainActivity.java -----"
          cat "$MAIN_ACTIVITY"

      - name: Sync Capacitor
        working-directory: form-android
        run: npx cap sync android

      - name: Build debug APK (installable on any Android phone via sideload)
        working-directory: form-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: form-debug-apk
          path: form-android/android/app/build/outputs/apk/debug/app-debug.apk
